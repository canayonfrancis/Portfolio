# Static portfolio — no build step; site files are at the repo root.
[build]
  publish = "."

# Consolidate the duplicate file URL into the canonical homepage URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Short-lived HTML caching keeps metadata updates discoverable after deploys.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
